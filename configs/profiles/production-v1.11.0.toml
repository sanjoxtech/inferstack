name = "production-v1.11.0"

[scheduler]
max_num_batched_tokens = 8192
max_running_requests = 128
max_prefill_chunk_tokens = 128
decode_priority = true
async_overlap = false

[kernels]
attention = "auto"
rmsnorm = "auto"
rope = "auto"
cuda_graphs = false
torch_compile = false
compile_mode = "reduce-overhead"

[native]
enabled = true
max_pending_requests = 512
max_requests_per_batch = 16
max_batch_tokens = 8192
batch_wait_ms = 3.0
dynamic_admission = true
live_batch_refill = true
active_batch_compaction = true
max_active_cohorts = 4
decode_quantum = 1
prefill_chunk_tokens = 128
prefill_chunks_per_turn = 1
# v1.8 (N3.1): token-budget prefill. Idle GPU: up to 8192 tokens per prefill forward;
# while requests are decoding: 1024, so decode steps are not starved.
prefill_token_budget_idle = 8192
prefill_token_budget_busy = 1024
# v1.9 (N3.3): GDN prefill on FLA's fused chunked kernel (flash-linear-attention 0.6.0,
# MIT). Strict: startup fails if it is not installed.
gdn_prefill_backend = "fla"
# v1.10 (N4.1): while decoding, a prefill forward may take up to ceil(queued prefill tokens / 4)
# (between the busy and idle budgets), so a burst of long prompts drains in ~4 forwards.
prefill_backlog_drain_steps = 4
# v1.11 (N4.2): GDN prefill conv on FLA fused Triton conv + SiLU over [B, T, D] (no transposes).
gdn_conv_backend = "fla"
prefix_state_cache = true
prefix_state_cache_max_entries = 64
prefix_state_cache_max_mb = 1024
prefix_cache_min_tokens = 128
prefix_cache_block_tokens = 128
custom_gdn_triton = true
strict_custom_kernels = false
fused_sampler = true
compile_model = false
compile_dynamic = true
strict_compile = false
explicit_cuda_graph = false
cuda_graph_batch_sizes = [1,2,4,8,16]
kv_padding_interval_size = 8192
quantization = "none"
quantization_group_size = 128
use_hf_kernels = false
graph_static_cache = false
graph_cache_max_tokens = 256
graph_generation_cloning = true
profile_decode = false

# v1.7: decode by CUDA-graph replay over a fixed slot pool (rows that do not fit fall back)
static_decode = true
static_decode_slots = 16
static_decode_max_tokens = 4096
static_decode_batch_buckets = [1,2,4,8,16]
static_decode_len_buckets = [256,512,1024,2048,4096]
static_decode_gdn_backend = "auto"
static_decode_cuda_graph = true
static_decode_strict = true

forward_fusion = true
fuse_rmsnorm = true
fuse_add_rmsnorm = true
fuse_gated_rmsnorm = true
fuse_mlp_gate_up = true
fuse_mlp_activation = true
fuse_gdn_projections = true
fuse_gdn_beta_g = true
grouped_gdn_decode = true
fuse_attention_qkv = true
forward_fusion_strict = false

[hardware]
device = "auto"
dtype = "bf16"
adaptive = true
