[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferstack"
dynamic = ["version"]
description = "InferStack v1.6 Qwen forward-fusion inference engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "httpx>=0.27", "packaging>=23", "numpy>=1.26", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
hf = ["transformers>=5.22.2,<5.23", "safetensors>=0.5", "huggingface-hub>=0.26"]
native = ["transformers[kernels]>=5.22.2,<5.23", "safetensors>=0.5"]
native-quant = ["torchao>=0.17,<0.18"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
inferstack = "inferstack.cli:main"

[tool.setuptools.dynamic]
version = {attr = "inferstack.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
